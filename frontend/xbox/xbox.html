<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwitchVault — Xbox Series X</title>
  <link rel="stylesheet" href="xbox.css?v=2.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Ecrã de Inicialização (Boot Video) -->
  <div id="bootScreen" class="boot-screen hidden">
    <video id="bootVideo" src="boot_xbox.mp4" playsinline preload="auto"></video>
  </div>

  <!-- Fundo Cinemático com Arte Dinâmica do Jogo Focado -->
  <div id="xboxBackdrop" class="xbox-backdrop">
    <div class="xbox-backdrop-overlay"></div>
  </div>

  <!-- Casca Principal Xbox -->
  <div class="xbox-viewport-shell">

    <!-- LINHA 1: Topbar Oficial Xbox -->
    <header class="xbox-topbar">
      <!-- Perfil (Esquerda) -->
      <div class="xbox-profile-zone">
        <button id="userMenuBtnXbox" class="xbox-user-btn" title="Alternar Consola">
          <div class="xbox-avatar-wrap">
            <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&q=80" alt="Avatar" class="xbox-user-avatar">
          </div>
          <div class="xbox-user-meta">
            <div class="gtag-line">
              <span class="gamertag-name">SwitchVault</span>
              <span class="badge-sub-ultimate">ULTIMATE</span>
            </div>
            <div class="gamerscore-val">
              <span class="g-circle">G</span> 21,337
            </div>
          </div>
        </button>

        <!-- Dropdown de Plataformas -->
        <div id="platformDropdownXbox" class="xbox-dropdown-menu hidden">
          <div class="xbox-dropdown-title">Mudar Consola</div>
          <button class="xbox-dropdown-item" data-platform="switch">
            <span class="p-dot dot-switch"></span> Nintendo Switch
          </button>
          <button class="xbox-dropdown-item" data-platform="ps5">
            <span class="p-dot dot-ps5"></span> PlayStation 5
          </button>
          <button class="xbox-dropdown-item active" data-platform="xbox">
            <span class="p-dot dot-xbox"></span> Xbox Series X
          </button>
          <button class="xbox-dropdown-item" data-platform="steam">
            <span class="p-dot dot-steam"></span> Steam Deck
          </button>
        </div>
      </div>

      <!-- Atalhos Centrais Oficiais -->
      <nav class="xbox-center-nav">
        <!-- Meus Jogos e Apps -->
        <button class="xbox-nav-pill" title="Meus Jogos e Aplicações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <rect x="3" y="3" width="4" height="18" rx="1"></rect>
            <rect x="10" y="3" width="4" height="18" rx="1"></rect>
            <rect x="17" y="3" width="4" height="18" rx="1"></rect>
          </svg>
        </button>

        <!-- Ingestão de ROMs / Armazenamento (Substituindo a Loja) -->
        <button id="btnQuickImportXbox" class="xbox-nav-pill" title="Importar ROMs / Compactar (.7z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>

        <!-- Game Pass Vault -->
        <button class="xbox-nav-pill" title="Xbox Game Pass Vault">
          <span class="gp-text-badge">GAME PASS</span>
        </button>

        <!-- Lupa de Busca -->
        <button id="btnSearchXbox" class="xbox-nav-pill" title="Pesquisar Jogos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Definições (Engrenagem com ponto de status) -->
        <button id="btnConfigXbox" class="xbox-nav-pill pill-settings" title="Definições da Consola">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="setting-green-dot"></span>
        </button>
      </nav>

      <!-- Indicadores de Status e Relógio 24h (Direita) -->
      <div class="xbox-status-indicators">
        <!-- Ícone de Som/Mudo -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="status-ic">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>

        <!-- Ícone de Bateria -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="status-ic">
          <rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect>
          <line x1="22" y1="11" x2="22" y2="13"></line>
        </svg>

        <!-- Relógio 24 Horas -->
        <span id="xboxClock" class="xbox-digital-clock">15:00</span>
      </div>
    </header>

    <!-- ÁREA CENTRAL DO DASHBOARD (Posicionada na base exata do print) -->
    <main class="xbox-stage-area">

      <!-- FAIXA 1: BLOCOS DE JOGOS RECENTES -->
      <section class="xbox-recent-row">
        
        <!-- Bloco Principal / Hero Focado (Starfield no print) -->
        <div id="xboxFocusedHeroTile" class="xb-hero-tile">
          <div class="xb-hero-inner">
            <img id="xbHeroImg" src="" alt="Hero Jogo">
            <div class="xb-hero-title-bar">
              <span id="xbHeroGameName" class="xb-hero-title">Nome do Jogo</span>
            </div>
          </div>
        </div>

        <!-- Grade de Jogos Recentes (Carregados da API) -->
        <div id="xboxRecentTiles" class="xb-recents-strip"></div>

      </section>

      <!-- FAIXA 2: CARTÕES HORIZONTAIS OFICIAIS (Abaixo dos jogos) -->
      <section class="xbox-bento-strip">
        
        <!-- Cartão 1: Browse your games -->
        <div id="cardBrowseGames" class="xb-bento-card card-browse" title="Explorar Biblioteca">
          <div class="bento-bg-art">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&q=80" alt="Games Collage">
            <div class="bento-art-overlay"></div>
          </div>
          <div class="bento-card-footer">
            <svg viewBox="0 0 24 24" fill="currentColor" class="bento-ctrl-ic">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.84 15.68c-.89.6-2.31 1.05-3.84 1.05-1.53 0-2.95-.45-3.84-1.05-.18-.12-.22-.38-.07-.53.79-.79 2.05-1.9 3.91-1.9 1.86 0 3.12 1.11 3.91 1.9.15.15.11.41-.07.53zM6.63 7.85c.98-1.09 2.4-1.89 3.55-2.22.18-.05.37.03.44.2.49 1.14 1.25 2.65 1.38 3.01.07.21-.02.43-.22.51-1.2.49-3.23 1.48-4.89 2.94-.17.15-.43.11-.53-.08-.34-.63-.58-1.34-.73-2.12-.04-.21.08-.41.28-.47.24-.07.49-.15.72-.25zm10.74 0c.23.1.48.18.72.25.2.06.32.26.28.47-.15.78-.39 1.49-.73 2.12-.1.19-.36.23-.53.08-1.66-1.46-3.69-2.45-4.89-2.94-.2-.08-.29-.3-.22-.51.13-.36.89-1.87 1.38-3.01.07-.17.26-.25.44-.2 1.15.33 2.57 1.13 3.55 2.22z"/>
            </svg>
            <strong>Navegue pelos seus jogos</strong>
          </div>
        </div>

        <!-- Cartão 2: Importar ROMs / Ingestão com 7-Zip -->
        <div id="cardImportBackups" class="xb-bento-card card-import" title="Escanear e Empacotar Backups">
          <div class="bento-bg-art">
            <div class="import-mesh-art">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mesh-brush-ic">
                <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </div>
          </div>
          <div class="bento-card-footer">
            <strong id="importBentoLabel">Importar Jogos (7-Zip)</strong>
          </div>
        </div>

        <!-- Cartão 3: Game Pass / Forza Highlight -->
        <div class="xb-bento-card card-gamepass" title="Cofre de Títulos">
          <div class="bento-bg-art">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80" alt="Forza">
            <div class="bento-art-overlay"></div>
          </div>
          <div class="bento-card-footer">
            <span class="gp-mini-badge">GAME PASS</span>
            <strong>Forza Horizon 5</strong>
          </div>
        </div>

        <!-- Cartão 4: Hardware & Armazenamento -->
        <div class="xb-bento-card card-hardware" title="Armazenamento do Sistema">
          <div class="bento-bg-art">
            <img src="https://images.unsplash.com/photo-1605901309584-818e25960a8f?w=600&q=80" alt="Xbox Controller">
            <div class="bento-art-overlay"></div>
          </div>
          <div class="bento-card-footer">
            <strong id="xbStorageMetric">Livre: 812.4 GB</strong>
          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- MODAL DE PESQUISA (LUPA COM FILTROS) -->
  <div id="searchModalXbox" class="xbox-modal-backdrop hidden">
    <div class="xbox-modal-box">
      <div class="search-head-row">
        <div class="search-field-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="xboxSearchInput" placeholder="Pesquisar títulos ou Product ID..." autocomplete="off">
          <button id="btnClearSearchXbox" class="search-clear-btn hidden">&times;</button>
        </div>
        <button id="btnCloseSearchXbox" class="xbox-modal-close">&times;</button>
      </div>

      <!-- Filtros por Categoria -->
      <div class="search-categories-row">
        <button class="xb-cat-chip active" data-category="todos">Todos</button>
        <button class="xb-cat-chip" data-category="Ação">Ação</button>
        <button class="xb-cat-chip" data-category="Aventura">Aventura</button>
        <button class="xb-cat-chip" data-category="RPG">RPG</button>
        <button class="xb-cat-chip" data-category="Corrida">Corrida</button>
        <button class="xb-cat-chip" data-category="Geral">Geral</button>
      </div>

      <div class="search-results-area">
        <div id="xboxSearchResultsGrid" class="xbox-search-grid"></div>
        <div id="xboxSearchEmpty" class="search-empty-text hidden">Nenhum título encontrado.</div>
      </div>
    </div>
  </div>

  <!-- MODAL DE DEFINIÇÕES COM BOTÃO DE DESLIGAR -->
  <div id="settingsModalXbox" class="xbox-modal-backdrop hidden">
    <div class="xbox-modal-box modal-settings">
      <div class="settings-title-row">
        <h2>Definições da Consola</h2>
        <button id="btnCloseSettingsXbox" class="xbox-modal-close">&times;</button>
      </div>

      <div class="settings-stack">
        <label class="setting-item">
          <div>
            <strong>Sons de Navegação do Xbox</strong>
            <p>Efeitos sonoros nativos sintetizados ao navegar pelos blocos</p>
          </div>
          <input type="checkbox" id="toggleSoundXbox" checked>
        </label>
        <label class="setting-item">
          <div>
            <strong>Transição de Arte de Fundo</strong>
            <p>Exibir a Key Art do jogo no fundo ao selecionar um bloco</p>
          </div>
          <input type="checkbox" id="toggleBackdropXbox" checked>
        </label>
      </div>

      <div class="settings-power-zone">
        <button id="btnPowerOffXbox" class="btn-power-xbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          <span>Desligar Xbox / Modo de Espera</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL FICHA TÉCNICA E EXTRAÇÃO -->
  <div id="gameModal" class="xbox-modal-backdrop hidden">
    <div class="xbox-modal-box modal-large">
      <button id="closeModalBtn" class="xbox-modal-close">&times;</button>
      <div class="modal-flex-split">
        <img id="modalCoverImg" src="" alt="Capa" class="modal-cover-art">
        <div class="modal-specs-area">
          <div class="modal-badges">
            <span class="badge-series-x">XBOX SERIES X</span>
            <span id="modalTitleId" class="badge-mono">00000000</span>
          </div>
          <h2 id="modalTitle" class="modal-name">Nome do Jogo</h2>
          <div class="modal-tech-strip">
            <div>
              <span class="dim">Pacote .7z Sólido:</span>
              <strong id="modalCompSize">0 MB</strong>
            </div>
            <div>
              <span class="dim">Compressão:</span>
              <strong class="text-green">7-Zip C++ (LZMA2)</strong>
            </div>
          </div>
          <div class="modal-files-table-wrapper">
            <table class="xbox-table">
              <thead><tr><th>Tipo</th><th>Arquivo</th><th>Tamanho Real</th></tr></thead>
              <tbody id="modalFilesTbody"></tbody>
            </table>
          </div>
          <button id="btnModalExtract" class="btn-xb-extract w-100">Iniciar Extração no Disco</button>
          <div id="modalExtractFeedback" class="feedback-text"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script src="xbox.js"></script>
</body>
</html>
