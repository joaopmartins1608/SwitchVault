<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwitchVault — Carregando Sistema...</title>
  <style>
    body {
      margin: 0;
      background-color: #0b0d13;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00d2ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <span style="font-size: 0.85rem; color: #8e95a5;">Iniciando SwitchVault...</span>
  </div>

  <script>
    // Recupera a última plataforma acessada (padrão: switch)
    const plataformaAtiva = localStorage.getItem("switchvault_plataforma") || "switch";
    
    // Redireciona para a pasta e arquivo específicos da plataforma
    window.location.replace(`/${plataformaAtiva}/${plataformaAtiva}.html`);
  </script>
</body>
</html>
